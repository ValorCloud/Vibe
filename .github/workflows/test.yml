name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test impact selection
        run: python3 .github/ci/test_impact.py
      - id: impact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/impact.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.impact.outputs.profile != 'metadata'
        run: |
          npm install --legacy-peer-deps
          npm ci --prefix api

      - name: Run tests
        if: steps.impact.outputs.profile != 'metadata'
        run: npm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

